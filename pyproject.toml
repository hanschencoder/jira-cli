[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-cli"
version = "0.1.0"
description = "命令行工具，调用 Jira REST API 查询/创建/更新 issue、下载附件，并配套指导 LLM 使用的 skills"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "requests>=2.28",
    "pyyaml>=6.0",
    "jira2markdown>=0.5",
    "markdown-it-py>=3.0",
    "platformdirs>=3.0",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
jira-cli = "jira_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
